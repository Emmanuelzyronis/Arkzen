name: Auto-capture leads

on:
  schedule:
    # Every 10 minutes. GitHub Actions cron runs in UTC.
    - cron: "*/10 * * * *"
  # Allow manual trigger from the Actions tab for testing.
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger capture
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/capture")

          cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Capture failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Capture succeeded (HTTP $HTTP_STATUS)"
