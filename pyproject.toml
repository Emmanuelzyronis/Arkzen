[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arkzen"
version = "0.1.0"
description = "Phase 1 evidence capture data models for Arkzen"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
arkzen = "arkzen.cli:main"

[project.optional-dependencies]
monitoring = ["twscrape>=0.20,<0.21"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
all = ["twscrape>=0.20,<0.21", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]
